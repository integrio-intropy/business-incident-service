apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: business-incidents-internal-pubsub-subscription
spec:
  topic: business-incidents
  routes:
    rules:
      - match: event.type == "io.intropy.business_incident.triggered"
        path: /events/subscribe/triggered
      - match: event.type == "io.intropy.business_incident.resolved"
        path: /events/subscribe/resolved
    default: /notfound
  pubsubname: business-incidents-internal
scopes:
  - business-incident-service
