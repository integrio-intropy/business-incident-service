apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ .Values.dapr.internalPubSub.name | quote }}
spec:
  type: {{ .Values.dapr.internalPubSub.type }}
  version: v1
  metadata:
    {{- .Values.dapr.internalPubSub.metadata | toYaml | nindent 4 }}
scopes:
  - {{ include "business-incident-service.fullname" . }}
---
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: {{ include "business-incident-service.daprPubSubSubscriptionName" . }}
spec:
  topic: {{ .Values.dapr.internalPubSub.topicName | quote }}
  routes:
    rules:
      - match: event.type == "io.intropy.business_incident.triggered"
        path: /events/subscribe/triggered
      - match: event.type == "io.intropy.business_incident.resolved"
        path: /events/subscribe/resolved
    default: /notfound
  pubsubname: {{ .Values.dapr.internalPubSub.name | quote }}
scopes:
  - {{ include "business-incident-service.fullname" . }}
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ .Values.dapr.notificationPubSub.name | quote }}
spec:
  type: {{ .Values.dapr.notificationPubSub.type }}
  version: v1
  metadata:
    {{- .Values.dapr.notificationPubSub.metadata | toYaml | nindent 4 }}
scopes:
  - {{ include "business-incident-service.fullname" . }}
  {{- range .Values.dapr.notificationPubSub.additionalScopes }}
  - {{ . }}
  {{- end }}
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ include "business-incident-service.fullname" . }}-outbox-cron
spec:
  type: bindings.cron
  version: v1
  metadata:
    - name: schedule
      value: "@every 30s"
    - name: route
      value: /outbox/process
scopes:
  - {{ include "business-incident-service.fullname" . }}
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ include "business-incident-service.fullname" . }}-outbox-purge-cron
spec:
  type: bindings.cron
  version: v1
  metadata:
    - name: schedule
      value: "@every 24h"
    - name: route
      value: /outbox/purge
scopes:
  - {{ include "business-incident-service.fullname" . }}