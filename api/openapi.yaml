openapi: 3.1.1
info:
  title: Intropy.BusinessIncidentService | v1
  version: 1.0.0
servers:
  - url: http://localhost:8080/
paths:
  /incidents/{id}:
    get:
      tags:
        - Intropy.BusinessIncidentService
      operationId: getIncident
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentResponse"
  /incidents:
    get:
      tags:
        - Intropy.BusinessIncidentService
      operationId: listIncidents
      parameters:
        - name: Source
          in: query
          schema:
            type: string
        - name: Status
          in: query
          schema:
            type: string
        - name: Page
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
        - name: PageSize
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentListResponse"
  /incidents/{id}/events:
    get:
      tags:
        - Intropy.BusinessIncidentService
      operationId: getIncidentEvents
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentEventResponse"
  /incidents/{id}/resolve:
    post:
      tags:
        - Intropy.BusinessIncidentService
      operationId: resolveIncident
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
components:
  schemas:
    IncidentEventResponse:
      required:
        - event_type
      type: object
      properties:
        id:
          type: string
          format: uuid
        incident_id:
          type: string
          format: uuid
        event_type:
          type: string
        metadata:
          type:
            - "null"
            - string
        occurred_at:
          type: string
          format: date-time
    IncidentListResponse:
      required:
        - items
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IncidentResponse"
        total:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          format: int32
    IncidentResponse:
      required:
        - source
        - ce_id
        - subject
        - description
        - status
      type: object
      properties:
        id:
          type: string
          format: uuid
        previous_id:
          type:
            - "null"
            - string
          format: uuid
        source:
          type: string
        ce_id:
          type: string
        subject:
          type: string
        description:
          type: string
        status:
          type: string
        batch_id:
          type:
            - "null"
            - string
        context:
          type:
            - "null"
            - object
          additionalProperties:
            type: string
        retry_count:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          format: int32
        triggered_at:
          type: string
          format: date-time
        last_retried_at:
          type:
            - "null"
            - string
          format: date-time
        resolved_at:
          type:
            - "null"
            - string
          format: date-time
        resolved_by:
          type:
            - "null"
            - string
    ProblemDetails:
      type: object
      properties:
        type:
          type:
            - "null"
            - string
        title:
          type:
            - "null"
            - string
        status:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - "null"
            - integer
            - string
          format: int32
        detail:
          type:
            - "null"
            - string
        instance:
          type:
            - "null"
            - string
tags:
  - name: Intropy.BusinessIncidentService
